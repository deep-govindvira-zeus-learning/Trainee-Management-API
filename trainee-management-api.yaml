version: '3.8'

services:
  mysql:
    image: docker-registry-002.zeuslearning.com/zeuslearning/mysql
    container_name: training_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: my_database
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - training_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: docker-registry-002.zeuslearning.com/zeuslearning/redis:latest
    container_name: training_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass YourSecurePassword123
    networks:
      - training_network

  rabbitmq:
    image: docker-registry-002.zeuslearning.com/zeuslearning/rabbitmq:latest
    container_name: submission_rabbitmq
    entrypoint: sh -c "rabbitmq-plugins enable rabbitmq_management && rabbitmq-server"
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    networks:
      - training_network

  trainee-api:
    image: trainee-management-api
    container_name: trainee-management-api-container
    ports:
      - "5093:8080"
      - "7135:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      # Injects the internal Docker network configuration string dynamically
      - 'ConnectionStrings__DefaultConnection=Server=training_mysql;Port=3306;Database=my_database;User=root;Password=root;'
      # Fixed: Overriding the appsettings value to use the correct internal port
      # - InternalService__BaseUrl=http://training-directory-api:8080
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      # redis:
      #   condition: service_started
      # rabbitmq:
      #   condition: service_started
    networks:
      - training_network

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:

networks:
  training_network:
    driver: bridge
